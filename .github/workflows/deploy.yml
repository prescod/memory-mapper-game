name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The site serves main at the root and the beta branch under /beta/, so every deploy builds both.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check for a beta branch
        id: beta
        run: |
          if git ls-remote --exit-code --heads origin beta > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout beta
        if: steps.beta.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-src

      - name: Build beta into /beta/
        if: steps.beta.outputs.exists == 'true'
        working-directory: beta-src
        run: |
          npm ci
          npm test
          npm run build:beta
          cp -r dist ../dist/beta

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
